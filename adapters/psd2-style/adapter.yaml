# stunt adapter manifest — Open Banking / PSD2 (Berlin Group NextGenPSD2) simulator
# Docs: https://stuntapi.com/stunt
#
# This adapter mimics the *structure* of the Berlin Group NextGenPSD2 API
# for LOCAL TESTING ONLY. It does not call any real bank API. All data is
# synthetic. See DISCLAIMER.
id: psd2-style
name: "Open Banking / PSD2 (Berlin Group NextGenPSD2) simulator (unofficial)"
version: "0.1.0"

api:
  name: "Open Banking / PSD2 (Berlin Group NextGenPSD2)"
  version: "1.3.6"

# Endpoints — each maps a route + method to a Starlark handler.
endpoints:
  # --- OAuth2 token (client-credentials for TPP auth) ---
  - route: /v1/oauth/token
    method: POST
    handler: scripts/oauth.star#on_token

  # --- Consents ---
  - route: /v1/consents
    method: POST
    handler: scripts/consents.star#on_create_consent
  - route: /v1/consents/{consentId}
    method: GET
    handler: scripts/consents.star#on_get_consent
  - route: /v1/consents/{consentId}
    method: DELETE
    handler: scripts/consents.star#on_delete_consent

  # --- Authorisations (SCA flow) ---
  - route: /v1/consents/{consentId}/authorisations
    method: POST
    handler: scripts/authorisations.star#on_start_authorisation
  - route: /v1/consents/{consentId}/authorisations/{authorisationId}
    method: GET
    handler: scripts/authorisations.star#on_get_authorisation
    concurrency_key: authorisationId # derive-on-read transition persists a state change
  - route: /v1/consents/{consentId}/authorisations/{authorisationId}
    method: PUT
    handler: scripts/authorisations.star#on_update_authorisation
    concurrency_key: authorisationId # staged SCA transition read-modify-writes the auth
  - route: /v1/consents/{consentId}/authorisations/{authorisationId}
    method: POST
    handler: scripts/authorisations.star#on_update_authorisation
    concurrency_key: authorisationId

  # --- Accounts (requires valid, covering consent) ---
  - route: /v1/accounts
    method: GET
    handler: scripts/accounts.star#on_list_accounts
  - route: /v1/accounts/{resourceId}/balances
    method: GET
    handler: scripts/accounts.star#on_get_balances
  - route: /v1/accounts/{resourceId}/transactions
    method: GET
    handler: scripts/accounts.star#on_get_transactions

  # --- Payment initiation (PIS) ---
  # Literal /v1/payments/{product}/status and .../authorisations routes
  # precede the parametrised {paymentId} routes where segment counts allow
  # ambiguity; the matcher resolves them by shape.
  - route: /v1/payments/{product}
    method: POST
    handler: scripts/payments.star#on_create_payment
  - route: /v1/payments/{product}/{paymentId}/status
    method: GET
    handler: scripts/payments.star#on_get_payment_status
    concurrency_key: paymentId # derive-on-read transition persists a state change
  - route: /v1/payments/{product}/{paymentId}/authorisations
    method: POST
    handler: scripts/payments.star#on_start_payment_authorisation
  - route: /v1/payments/{product}/{paymentId}/authorisations/{authorisationId}
    method: GET
    handler: scripts/payments.star#on_get_payment_authorisation
    concurrency_key: authorisationId # derive-on-read transition persists a state change
  - route: /v1/payments/{product}/{paymentId}/authorisations/{authorisationId}
    method: PUT
    handler: scripts/payments.star#on_update_payment_authorisation
    concurrency_key: authorisationId # staged SCA transition read-modify-writes the auth
  - route: /v1/payments/{product}/{paymentId}/authorisations/{authorisationId}
    method: POST
    handler: scripts/payments.star#on_update_payment_authorisation
    concurrency_key: authorisationId
  - route: /v1/payments/{product}/{paymentId}
    method: GET
    handler: scripts/payments.star#on_get_payment
    concurrency_key: paymentId # derive-on-read transition persists a state change
  - route: /v1/payments/{product}/{paymentId}
    method: DELETE
    handler: scripts/payments.star#on_cancel_payment
    concurrency_key: paymentId # cancellation read-modify-writes the payment

# Backing stores — collections for stateful data.
resources:
  - name: consents
    kind: collection
  - name: authorisations
    kind: collection
  - name: payments
    kind: collection
  - name: accounts
    kind: collection
    seed: fixtures/accounts.jsonl
  - name: transactions
    kind: collection
    seed: fixtures/transactions.jsonl
  - name: access_tokens
    kind: collection

# Auth scheme: OAuth2 bearer tokens.
identity:
  token_scheme: bearer

# Catch-all: any unmatched route returns a 404.
rules:
  - name: catchall-404
    match: { path: "/**" }
    respond:
      status: 404
      body:
        inline:
          tppMessages:
            - category: "ERROR"
              code: "SERVICE_INVALID"
              text: "Resource not found"
