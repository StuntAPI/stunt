# Braintree GraphQL API (2024-09-01) schema — the surface this adapter
# models, mapped onto the same stores and lib.star state machine as the REST
# surface.
#
# Conventions followed from the real API: Amount is a custom scalar carrying
# a decimal string ("10.00"), TransactionStatus/TransactionType serialize as
# uppercase enum values, mutations are verb-y with input/payload pairs, and
# searchTransactions takes the search-criteria vocabulary ({is}, {in},
# {min}/{max} ranges).

scalar DateTime

"""A monetary amount serialized as a decimal string, e.g. "10.00"."""
scalar Amount

enum TransactionStatus {
  AUTHORIZATION_EXPIRED
  AUTHORIZED
  GATEWAY_REJECTED
  PROCESSOR_DECLINED
  SETTLED
  SETTLEMENT_PENDING
  SETTLING
  SUBMITTED_FOR_SETTLEMENT
  VOIDED
}

enum TransactionType {
  SALE
  AUTHORIZATION
  CREDIT
}

type Customer {
  id: ID!
  firstName: String
  lastName: String
  email: String
  createdAt: DateTime!
}

type CreditCard {
  last4: String!
  cardType: String!
  expirationDate: String!
}

type Transaction {
  id: ID!
  status: TransactionStatus!
  type: TransactionType!
  amount: Amount!
  currencyISOCode: String
  customer: Customer
  creditCard: CreditCard
  createdAt: DateTime!
  settledAt: DateTime
  voidedAt: DateTime
  refundedTransactionId: ID
}

type TransactionEdge {
  node: Transaction!
}

type TransactionSearchPayload {
  edges: [TransactionEdge!]!
  totalCount: Int!
}

# --- search criteria --------------------------------------------------------

input TransactionSearchCriteria {
  is: String
  in: [String!]
  min: String
  max: String
}

input TransactionSearchInput {
  id: TransactionSearchCriteria
  status: TransactionSearchCriteria
  type: TransactionSearchCriteria
  amount: TransactionSearchCriteria
  currency: TransactionSearchCriteria
  createdAt: TransactionSearchCriteria
  customerId: TransactionSearchCriteria
  creditCardLast4: TransactionSearchCriteria
}

# --- customer ---------------------------------------------------------------

input CustomerCreateInput {
  firstName: String
  lastName: String
  email: String
  paymentMethodId: ID
}

type CustomerPayload {
  customer: Customer
}

# --- transactions -----------------------------------------------------------

input TransactionChargeInput {
  amount: Amount
  orderId: String
  currencyISOCode: String
  deviceData: String
  options: TransactionOptionsInput
}

input TransactionOptionsInput {
  submitForSettlement: Boolean
}

input ChargePaymentMethodInput {
  paymentMethodId: ID!
  transaction: TransactionChargeInput!
}

type ChargePaymentMethodPayload {
  transaction: Transaction
}

input AuthorizePaymentMethodInput {
  paymentMethodId: ID!
  transaction: TransactionChargeInput!
}

type AuthorizePaymentMethodPayload {
  transaction: Transaction
}

input CreditCardInput {
  number: String!
  cardholderName: String
  cvv: String
  expirationDate: String
}

input ChargeCreditCardInput {
  creditCard: CreditCardInput!
  transaction: TransactionChargeInput!
}

type ChargeCreditCardPayload {
  transaction: Transaction
}

input AuthorizeCreditCardInput {
  creditCard: CreditCardInput!
  transaction: TransactionChargeInput!
}

type AuthorizeCreditCardPayload {
  transaction: Transaction
}

input VoidTransactionInput {
  transactionId: ID!
}

type VoidTransactionPayload {
  transaction: Transaction
}

input RefundTransactionInput {
  transactionId: ID!
  amount: Amount
}

type RefundTransactionPayload {
  refund: Transaction
}

type Query {
  ping: Boolean!
  customer(id: ID!): Customer
  transaction(id: ID!): Transaction
  searchTransactions(search: TransactionSearchInput!): TransactionSearchPayload!
}

type Mutation {
  createCustomer(input: CustomerCreateInput!): CustomerPayload!
  chargePaymentMethod(input: ChargePaymentMethodInput!): ChargePaymentMethodPayload!
  authorizePaymentMethod(input: AuthorizePaymentMethodInput!): AuthorizePaymentMethodPayload!
  chargeCreditCard(input: ChargeCreditCardInput!): ChargeCreditCardPayload!
  authorizeCreditCard(input: AuthorizeCreditCardInput!): AuthorizeCreditCardPayload!
  voidTransaction(input: VoidTransactionInput!): VoidTransactionPayload!
  refundTransaction(input: RefundTransactionInput!): RefundTransactionPayload!
}
