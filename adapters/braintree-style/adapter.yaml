# stunt adapter manifest — Braintree GraphQL + REST API simulator (unofficial)
# Docs: https://stuntapi.com/stunt
#
# This adapter mimics the *structure* of the Braintree GraphQL + REST API
# for LOCAL TESTING ONLY. It does not call the real Braintree API. All data
# is synthetic. See DISCLAIMER.
id: braintree-style
name: "Braintree GraphQL + REST API simulator (unofficial)"
version: "0.2.0"

api:
  name: "Braintree GraphQL + REST API"
  version: "2024-09-01"

# Auth: Bearer or public/private key.
identity:
  token_scheme: bearer

# Endpoints — each maps a route + method to a Starlark handler.
# NOTE: literal routes must come BEFORE parameterized routes so they are
# matched first (the dispatch engine checks in declaration order).
# concurrency_key serializes handlers that read-modify-write the same
# transaction/subscription ({id} path param).
endpoints:
  # --- GraphQL (primary API) ---
  - route: /graphql
    method: POST
    handler: scripts/graphql.star#on_graphql

  # --- REST (alternative) ---
  - route: /merchants/{merchantId}/transactions/advanced_search
    method: POST
    handler: scripts/rest.star#on_advanced_search
  - route: /merchants/{merchantId}/transactions
    method: POST
    handler: scripts/rest.star#on_create_transaction
  - route: /merchants/{merchantId}/transactions/{id}
    method: GET
    handler: scripts/rest.star#on_get_transaction
    concurrency_key: id
  - route: /merchants/{merchantId}/transactions/{id}/settle
    method: POST
    handler: scripts/rest.star#on_settle_transaction
    concurrency_key: id
  - route: /merchants/{merchantId}/transactions/{id}/void
    method: POST
    handler: scripts/rest.star#on_void_transaction
    concurrency_key: id
  - route: /merchants/{merchantId}/transactions/{id}/refund
    method: POST
    handler: scripts/rest.star#on_refund_transaction
    concurrency_key: id
  - route: /merchants/{merchantId}/payment_methods
    method: POST
    handler: scripts/rest.star#on_create_payment_method
  - route: /merchants/{merchantId}/client_token
    method: POST
    handler: scripts/rest.star#on_client_token

  # --- Plans + subscriptions (recurring billing) ---
  - route: /merchants/{merchantId}/plans
    method: POST
    handler: scripts/subscriptions.star#on_create_plan
  - route: /merchants/{merchantId}/plans
    method: GET
    handler: scripts/subscriptions.star#on_list_plans
  - route: /merchants/{merchantId}/plans/{id}
    method: GET
    handler: scripts/subscriptions.star#on_get_plan
  - route: /merchants/{merchantId}/subscriptions
    method: POST
    handler: scripts/subscriptions.star#on_create_subscription
  - route: /merchants/{merchantId}/subscriptions/{id}
    method: GET
    handler: scripts/subscriptions.star#on_get_subscription
    concurrency_key: id
  - route: /merchants/{merchantId}/subscriptions/{id}/cancel
    method: POST
    handler: scripts/subscriptions.star#on_cancel_subscription
    concurrency_key: id

  # --- Webhooks (inbound) ---
  - route: /webhooks
    method: POST
    handler: scripts/webhooks.star#on_webhook

# Backing stores — collections for stateful data.
resources:
  - name: transactions
    kind: collection
  - name: customers
    kind: collection
  - name: plans
    kind: collection
  - name: subscriptions
    kind: collection
  - name: webhooks
    kind: collection

# Catch-all: any unmatched route returns a 404.
rules:
  - name: catchall-404
    match: { path: "/**" }
    respond:
      status: 404
      body:
        inline:
          error:
            message: "Not found"
