    seed: fixtures/customers.jsonl
  - name: connect_accounts
    kind: collection
    seed: fixtures/connect_accounts.jsonl
  - name: transfers
    kind: collection
  - name: payouts
    kind: collection
  - name: payment_intents
    kind: collection
  - name: payment_methods
    kind: collection
  - name: refunds
    kind: collection
  - name: tokens
    kind: collection
  - name: events
    kind: collection
  - name: test_clocks
    kind: collection
  - name: balance_transactions
    kind: collection
  - name: disputes
    kind: collection
  - name: application_fees
    kind: collection
  - name: invoices
