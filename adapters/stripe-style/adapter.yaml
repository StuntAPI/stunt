    handler: scripts/subscription_items.star#on_delete_subscription_item
    concurrency_key: id
  - route: /v1/subscription_items/{id}/usage_records
    method: POST
    handler: scripts/subscription_items.star#on_create_usage_record
    concurrency_key: id
  - route: /v1/subscription_items/{id}/usage_records
    method: GET
    handler: scripts/subscription_items.star#on_list_usage_records

  # --- Invoices (draft -> open -> paid/void/uncollectible + preview) ---
  # /v1/invoices/upcoming is literal and listed before /v1/invoices/{id}.
  - route: /v1/invoices
    method: POST
    handler: scripts/invoices.star#on_create_invoice
  - route: /v1/invoices
    method: GET
    handler: scripts/invoices.star#on_list_invoices
  - route: /v1/invoices/upcoming
    method: GET
    handler: scripts/invoices.star#on_upcoming_invoice
  - route: /v1/invoices/{id}
    method: GET
    handler: scripts/invoices.star#on_retrieve_invoice
  - route: /v1/invoices/{id}
    method: POST
    handler: scripts/invoices.star#on_update_invoice
    concurrency_key: id
  - route: /v1/invoices/{id}
    method: DELETE
    handler: scripts/invoices.star#on_delete_invoice
    concurrency_key: id
  - route: /v1/invoices/{id}/finalize
    method: POST
    handler: scripts/invoices.star#on_finalize_invoice
    concurrency_key: id
  - route: /v1/invoices/{id}/pay
