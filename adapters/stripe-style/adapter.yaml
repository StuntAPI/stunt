# stunt adapter manifest — Stripe-style API simulator (unofficial)
# Docs: https://stuntapi.com/stunt
#
# This adapter mimics the *structure* of a Stripe-style payments API for
# LOCAL TESTING ONLY. It does not call the real Stripe API. All data is
# synthetic. See DISCLAIMER.
id: stripe-style
name: "Stripe-style API simulator (unofficial)"
version: "0.3.0"

api:
  name: "Stripe API"
  version: "2025-01-27.acacia"

# Endpoints — each maps a route + method to a Starlark handler.
# Route matching is first-match-wins in file order, so literal routes
# (e.g. /v1/invoices/upcoming) are always listed BEFORE parameterized
# ones (e.g. /v1/invoices/{id}) that would otherwise shadow them.
endpoints:
  # --- Tokens ---
  # With a card body: creates a Stripe-style card token (tok_*) whose stored
  # number drives the decline/SCA test-card behavior (auth required).
  # Without: mints a real identity token for authenticated requests in
  # tests/dev. Does NOT require auth — it is how callers obtain a bearer token.
  - route: /v1/tokens
    method: POST
    handler: scripts/tokens.star#on_mint_token

  # --- Events (recorded copies of emitted webhooks) ---
  - route: /v1/events
    method: GET
    handler: scripts/events.star#on_list_events
  - route: /v1/events/{id}
    method: GET
    handler: scripts/events.star#on_retrieve_event

  # --- Test Clocks (deterministic time; ONE global clock — see
  #     scripts/test_clocks.star). Short routes + Stripe's real
  #     /v1/test_helpers/test_clocks routes hit the same handlers. ---
  - route: /v1/test_clocks
    method: POST
    handler: scripts/test_clocks.star#on_create_test_clock
  - route: /v1/test_clocks
    method: GET
    handler: scripts/test_clocks.star#on_list_test_clocks
  - route: /v1/test_clocks/{id}/advance
    method: POST
    handler: scripts/test_clocks.star#on_advance_test_clock
    concurrency_key: id
  - route: /v1/test_clocks/{id}
    method: GET
    handler: scripts/test_clocks.star#on_retrieve_test_clock
  - route: /v1/test_clocks/{id}
    method: DELETE
    handler: scripts/test_clocks.star#on_delete_test_clock
    concurrency_key: id
  - route: /v1/test_helpers/test_clocks
    method: POST
    handler: scripts/test_clocks.star#on_create_test_clock
  - route: /v1/test_helpers/test_clocks
    method: GET
    handler: scripts/test_clocks.star#on_list_test_clocks
  - route: /v1/test_helpers/test_clocks/{id}/advance
    method: POST
    handler: scripts/test_clocks.star#on_advance_test_clock
    concurrency_key: id
  - route: /v1/test_helpers/test_clocks/{id}
    method: GET
    handler: scripts/test_clocks.star#on_retrieve_test_clock
  - route: /v1/test_helpers/test_clocks/{id}
    method: DELETE
    handler: scripts/test_clocks.star#on_delete_test_clock
    concurrency_key: id

  # --- Charges ---
  - route: /v1/charges
    method: POST
    handler: scripts/charges.star#on_create_charge
  - route: /v1/charges/{id}
    method: GET
    handler: scripts/charges.star#on_retrieve_charge
  - route: /v1/charges
    method: GET
    handler: scripts/charges.star#on_list_charges
  - route: /v1/charges/{id}/capture
    method: POST
    handler: scripts/charges.star#on_capture_charge
    concurrency_key: id
  - route: /v1/charges/{id}/refund
    method: POST
    handler: scripts/charges.star#on_refund_charge
    concurrency_key: id

  # --- PaymentIntents (canonical payment object, SCA/3DS-ready) ---
  - route: /v1/payment_intents
    method: POST
    handler: scripts/payment_intents.star#on_create_payment_intent
  - route: /v1/payment_intents/{id}/confirm
    method: POST
    handler: scripts/payment_intents.star#on_confirm_payment_intent
    concurrency_key: id
  - route: /v1/payment_intents/{id}/capture
    method: POST
    handler: scripts/payment_intents.star#on_capture_payment_intent
    concurrency_key: id
  - route: /v1/payment_intents/{id}
    method: GET
    handler: scripts/payment_intents.star#on_retrieve_payment_intent
  - route: /v1/payment_intents
    method: GET
    handler: scripts/payment_intents.star#on_list_payment_intents

  # --- PaymentMethods ---
  - route: /v1/payment_methods
    method: POST
    handler: scripts/payment_methods.star#on_create_payment_method
  - route: /v1/payment_methods/{id}/attach
    method: POST
    handler: scripts/payment_methods.star#on_attach_payment_method
  - route: /v1/payment_methods/{id}/detach
    method: POST
    handler: scripts/payment_methods.star#on_detach_payment_method
  - route: /v1/payment_methods/{id}
    method: GET
    handler: scripts/payment_methods.star#on_retrieve_payment_method
  - route: /v1/payment_methods
    method: GET
    handler: scripts/payment_methods.star#on_list_payment_methods

  # --- Refunds (first-class resource) ---
  - route: /v1/refunds
    method: POST
    handler: scripts/refunds.star#on_create_refund
  - route: /v1/refunds/{id}
    method: GET
    handler: scripts/refunds.star#on_retrieve_refund
  - route: /v1/refunds
    method: GET
    handler: scripts/refunds.star#on_list_refunds
  - route: /v1/refunds/{id}/cancel
    method: POST
    handler: scripts/refunds.star#on_cancel_refund
    concurrency_key: id

  # --- Customers ---
  - route: /v1/customers
    method: POST
    handler: scripts/customers.star#on_create_customer
  - route: /v1/customers/{id}
    method: GET
    handler: scripts/customers.star#on_retrieve_customer
  - route: /v1/customers
    method: GET
    handler: scripts/customers.star#on_list_customers
  - route: /v1/customers/{id}
    method: POST
    handler: scripts/customers.star#on_update_customer
  - route: /v1/customers/{id}
    method: DELETE
    handler: scripts/customers.star#on_delete_customer
    concurrency_key: id # read-then-flag read-modify-write, serialized per customer

  # --- Products ---
  - route: /v1/products
    method: POST
    handler: scripts/products.star#on_create_product
  - route: /v1/products
    method: GET
    handler: scripts/products.star#on_list_products
  - route: /v1/products/{id}
    method: GET
    handler: scripts/products.star#on_retrieve_product
  - route: /v1/products/{id}
    method: POST
    handler: scripts/products.star#on_update_product
    concurrency_key: id
  - route: /v1/products/{id}
    method: DELETE
    handler: scripts/products.star#on_delete_product
    concurrency_key: id

  # --- Prices (no delete: archive with active=false) ---
  - route: /v1/prices
    method: POST
    handler: scripts/prices.star#on_create_price
  - route: /v1/prices
    method: GET
    handler: scripts/prices.star#on_list_prices
  - route: /v1/prices/{id}
    method: GET
    handler: scripts/prices.star#on_retrieve_price
  - route: /v1/prices/{id}
    method: POST
    handler: scripts/prices.star#on_update_price
    concurrency_key: id

  # --- Subscriptions ---
  - route: /v1/subscriptions
    method: POST
    handler: scripts/subscriptions.star#on_create_subscription
  - route: /v1/subscriptions
    method: GET
    handler: scripts/subscriptions.star#on_list_subscriptions
  - route: /v1/subscriptions/{id}
    method: GET
    handler: scripts/subscriptions.star#on_retrieve_subscription
  - route: /v1/subscriptions/{id}
    method: POST
