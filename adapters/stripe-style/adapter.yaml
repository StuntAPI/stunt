    handler: scripts/promotion_codes.star#on_create_promotion_code
  - route: /v1/promotion_codes
    method: GET
    handler: scripts/promotion_codes.star#on_list_promotion_codes
  - route: /v1/promotion_codes/{id}
    method: GET
    handler: scripts/promotion_codes.star#on_retrieve_promotion_code
  - route: /v1/promotion_codes/{id}
    method: POST
    handler: scripts/promotion_codes.star#on_update_promotion_code
    concurrency_key: id

  # --- Tax rates ---
  - route: /v1/tax_rates
    method: POST
    handler: scripts/tax_rates.star#on_create_tax_rate
  - route: /v1/tax_rates
    method: GET
    handler: scripts/tax_rates.star#on_list_tax_rates
  - route: /v1/tax_rates/{id}
    method: GET
    handler: scripts/tax_rates.star#on_retrieve_tax_rate
  - route: /v1/tax_rates/{id}
    method: POST
    handler: scripts/tax_rates.star#on_update_tax_rate
    concurrency_key: id
  - route: /v1/tax_rates/{id}
    method: DELETE
    handler: scripts/tax_rates.star#on_delete_tax_rate
    concurrency_key: id

  # --- Balance ---
  - route: /v1/balance
    method: GET
    handler: scripts/balance.star#on_get_balance
  - route: /v1/balance_transactions
    method: GET
    handler: scripts/balance.star#on_list_balance_transactions
  - route: /v1/balance_transactions/{id}
