# stunt adapter manifest — Azure DevOps REST API simulator (unofficial)
# Docs: https://stuntapi.com/stunt
#
# This adapter mimics the *structure* of the Azure DevOps REST API (v7.1)
# for LOCAL TESTING ONLY. It does not call the real Azure DevOps API. All
# data is synthetic. See DISCLAIMER.
id: azure-devops-style
name: "Azure DevOps REST API simulator (unofficial)"
version: "0.2.0"

api:
  name: "Azure DevOps REST API"
  version: "7.1"

# Endpoints — each maps a route + method to a Starlark handler.
# NOTE: literal routes must come BEFORE parameterized routes so they are
# matched first (the dispatch engine checks in declaration order).
endpoints:
  # --- Projects (org-level) ---
  - route: /{org}/_apis/projects
    method: GET
    handler: scripts/projects.star#on_list_projects

  # --- Pipelines ---
  - route: /{org}/{project}/_apis/pipelines
    method: GET
    handler: scripts/pipelines.star#on_list_pipelines

  - route: /{org}/{project}/_apis/pipelines/{pipelineId}
    method: GET
    handler: scripts/pipelines.star#on_get_pipeline

  - route: /{org}/{project}/_apis/pipelines/{pipelineId}/runs
    method: GET
    handler: scripts/pipelines.star#on_list_runs
    concurrency_key: pipelineId # advancing runs is read-modify-write

  - route: /{org}/{project}/_apis/pipelines/{pipelineId}/runs
    method: POST
    handler: scripts/pipelines.star#on_queue_run

  - route: /{org}/{project}/_apis/pipelines/{pipelineId}/runs/{runId}
    method: GET
    handler: scripts/pipelines.star#on_get_run
    concurrency_key: runId # deriving state is read-modify-write

  # --- Git repositories (project-level) ---
  - route: /{org}/{project}/_apis/git/repositories
    method: GET
    handler: scripts/git.star#on_list_repos

  # --- Git items ---
  - route: /{org}/{project}/_apis/git/repositories/{repoId}/items
    method: GET
    handler: scripts/git.star#on_get_item

  # --- Git commits ---
  - route: /{org}/{project}/_apis/git/repositories/{repoId}/commits
    method: GET
    handler: scripts/git.star#on_list_commits

  # --- Git push (commits) ---
  - route: /{org}/{project}/_apis/git/repositories/{repoId}/pushes
    method: POST
    handler: scripts/git.star#on_push
    concurrency_key: repoId # advancing the ref/tree is read-modify-write

  # --- Work tracking: iterations ---
  - route: /{org}/{project}/_apis/work/teamsettings/iterations
    method: GET
    handler: scripts/work.star#on_iterations

  # --- Work items: list by ids ---
  - route: /{org}/{project}/_apis/wit/workitems
    method: GET
    handler: scripts/workitems.star#on_list_workitems

  # --- Work items: get by id / update (patch document) ---
  - route: /{org}/{project}/_apis/wit/workitems/{id}
    method: GET
    handler: scripts/workitems.star#on_get_workitem

  - route: /{org}/{project}/_apis/wit/workitems/{id}
    method: PATCH
    handler: scripts/workitems.star#on_update_workitem
    concurrency_key: id # rev bump is read-modify-write

  # --- Work items: create (typed route, patch-document body) ---
  - route: /{org}/{project}/_apis/wit/workitems/{type}
    method: POST
    handler: scripts/workitems.star#on_create_workitem

  # --- WIQL ---
  - route: /{org}/{project}/_apis/wit/wiql
    method: POST
    handler: scripts/workitems.star#on_wiql

  # --- Service hooks (webhook subscriptions) ---
  - route: /{org}/_apis/hooks/subscriptions
    method: POST
    handler: scripts/hooks.star#on_create_subscription

# Backing stores — collections for stateful data.
resources:
  - name: projects
    kind: collection
  - name: repos
    kind: collection
  - name: workitems
    kind: collection
  - name: subscriptions
    kind: collection
  - name: pipelines
    kind: collection
  - name: runs
    kind: collection
  - name: commits
    kind: collection
  - name: gitblobs
    kind: collection
  - name: refs
    kind: collection

# Auth scheme metadata.
identity:
  token_scheme: basic_bearer

# Catch-all: any unmatched route returns a 404.
rules:
  - name: catchall-404
    match: { path: "/**" }
    respond:
      status: 404
      body:
        inline:
          messageId: "NotFound"
