# stunt adapter manifest — Google-Drive-style API simulator (unofficial)
# Docs: https://stuntapi.com/stunt
#
# This adapter mimics the *structure* of a Google-Drive-style files API for
# LOCAL TESTING ONLY. It does not call the real Google Drive API. All data is
# synthetic. See DISCLAIMER.
id: drive-style
name: "Google-Drive-style API simulator (unofficial)"
version: "0.2.0"

api:
  name: "Google Drive API"
  version: "v3"

# Endpoints — each maps a route + method to a Starlark handler.
# Literal routes come before param routes.
endpoints:
  # --- OAuth2 (unauthenticated) ---
  - route: /o/oauth2/auth
    method: GET
    handler: scripts/oauth.star#on_authorize
  - route: /o/oauth2/token
    method: POST
    handler: scripts/oauth.star#on_token

  # --- Files (upload, metadata, download, list, patch, delete) ---
  # POST: direct create (JSON/raw body) or, with ?uploadType=resumable,
  # resumable-session initiation (200 + Location).
  - route: /upload/drive/v3/files
    method: POST
    handler: scripts/files.star#on_upload
  # PUT to the session URL: resumable chunks (strict Content-Range; 308
  # Resume Incomplete + Range until the final chunk). The session id rides
  # the PATH so concurrency_key can serialize chunk retries per session —
  # blob append is not linearizable across concurrent writers.
  # No bearer check — real upload session URLs are pre-authenticated.
  - route: /upload/drive/v3/files/{upload_id}
    method: PUT
    handler: scripts/files.star#on_resumable_chunk
    concurrency_key: upload_id
  # DELETE to the session URL: cancel the upload (499, the Google upload
  # backend's cancel status) and discard the partial bytes.
  - route: /upload/drive/v3/files/{upload_id}
    method: DELETE
    handler: scripts/files.star#on_resumable_cancel
  - route: /drive/v3/files
    method: GET
    handler: scripts/files.star#on_list
  - route: /drive/v3/files
    method: POST
    handler: scripts/files.star#on_create_metadata
  - route: /drive/v3/files/{id}
    method: GET
    handler: scripts/files.star#on_get
  - route: /drive/v3/files/{id}
    method: PATCH
    handler: scripts/files.star#on_patch
    concurrency_key: id # read-modify-write on the file doc
  - route: /drive/v3/files/{id}
    method: DELETE
    handler: scripts/files.star#on_delete

  # --- About / quota ---
  - route: /drive/v3/about
    method: GET
    handler: scripts/misc.star#on_about

  # --- Changes feed (literal routes before any param route) ---
  - route: /drive/v3/changes/startPageToken
    method: GET
    handler: scripts/misc.star#on_changes_start
  - route: /drive/v3/changes
    method: GET
    handler: scripts/misc.star#on_changes

# Backing stores available to Starlark handlers.
resources:
  - name: files
    kind: collection
    seed: fixtures/files.jsonl
  - name: changes
    kind: collection
  - name: upload_sessions
    kind: collection
  - name: tokens
    kind: collection
  - name: refresh_tokens
    kind: collection
  - name: codes
    kind: collection

# Auth scheme metadata (mock: bearer tokens validated against the tokens
# collection; minted by the OAuth2 endpoints or the seeded static test
# token ya29.mock_test_token_drive).
identity:
  token_scheme: bearer

# Catch-all: any unmatched route returns a 404.
rules:
  - name: catchall-404
    match: { path: "/**" }
    respond:
      status: 404
      body:
        inline:
          error: resource_not_found
