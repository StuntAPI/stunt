# stunt adapter manifest — Chainlink Data Feeds + Functions + Automation + CCIP
# simulator (unofficial)
# Docs: https://stuntapi.com/stunt
#
# This adapter mimics the *structure* of the Chainlink off-chain services
# API for LOCAL TESTING ONLY. It does not call the real Chainlink API. All
# data is synthetic. See DISCLAIMER.
id: chainlink-style
name: "Chainlink Data Feeds + Functions + Automation + CCIP simulator (unofficial)"
version: "0.2.0"

api:
  name: "Chainlink Data Feeds + Functions + Automation"
  version: "1.0"

# Auth: Bearer for Functions/Automation/CCIP; Data Feeds are public.
identity:
  token_scheme: bearer

# Endpoints — each maps a route + method to a Starlark handler.
# NOTE: literal routes must come BEFORE parameterized routes so they are
# matched first (the dispatch engine checks in declaration order).
# concurrency_key serialises read-modify-write handlers against the same
# path-param value (derive-on-read state transitions, fund/withdraw).
endpoints:
  # --- Data Feeds (public, no auth required) ---
  - route: /feeds
    method: GET
    handler: scripts/feeds.star#on_list_feeds
  - route: /feeds/{feedID}
    method: GET
    handler: scripts/feeds.star#on_get_feed
  - route: /feeds/{feedID}/latestRoundData
    method: GET
    handler: scripts/feeds.star#on_latest_round_data
  - route: /feeds/{feedID}/rounds
    method: GET
    handler: scripts/feeds.star#on_list_rounds
  - route: /feeds/{feedID}/rounds/{roundId}
    method: GET
    handler: scripts/feeds.star#on_get_round

  # --- Functions (auth required) ---
  - route: /v2/functions/createSecrets
    method: POST
    handler: scripts/functions.star#on_create_secrets
  - route: /v2/functions/encryptSecrets
    method: POST
    handler: scripts/functions.star#on_encrypt_secrets
  - route: /v2/functions/createRequest
    method: POST
    handler: scripts/functions.star#on_create_request
  - route: /v2/functions/request/{requestID}
    method: GET
    handler: scripts/functions.star#on_get_request
    concurrency_key: requestID # derive-on-read transition persists a state change
  - route: /v2/functions/secrets/{secretID}
    method: GET
    handler: scripts/functions.star#on_get_secrets

  # --- Automation (auth required; keepers-registry lifecycle) ---
  - route: /v2/automation/registerUpkeep
    method: POST
    handler: scripts/automation.star#on_register_upkeep
  - route: /v2/automation/upkeeps
    method: GET
    handler: scripts/automation.star#on_list_upkeeps
  - route: /v2/automation/{id}
    method: GET
    handler: scripts/automation.star#on_get_upkeep
    concurrency_key: id # derive-on-read performs persist state changes
  - route: /v2/automation/{id}/fund
    method: POST
    handler: scripts/automation.star#on_fund_upkeep
    concurrency_key: id
  - route: /v2/automation/{id}/cancel
    method: POST
    handler: scripts/automation.star#on_cancel_upkeep
    concurrency_key: id
  - route: /v2/automation/{id}/withdraw
    method: POST
    handler: scripts/automation.star#on_withdraw_upkeep
    concurrency_key: id
  - route: /v2/automation/{id}/check
    method: GET
    handler: scripts/automation.star#on_check_upkeep
    concurrency_key: id
  - route: /v2/automation/{id}/perform
    method: POST
    handler: scripts/automation.star#on_perform_upkeep
    concurrency_key: id
  - route: /v2/automation/{id}/performs
    method: GET
    handler: scripts/automation.star#on_list_performs
    concurrency_key: id

  # --- CCIP (auth required) ---
  - route: /v2/ccip/messages
    method: GET
    handler: scripts/ccip.star#on_list_messages
  - route: /v2/ccip/lane/{src}/{dst}
    method: GET
    handler: scripts/ccip.star#on_lane

# Backing stores — collections for stateful data.
resources:
  - name: feeds
    kind: collection
  - name: secrets
    kind: collection
  - name: requests
    kind: collection
  - name: upkeeps
    kind: collection

# Catch-all: any unmatched route returns a 404.
rules:
  - name: catchall-404
    match: { path: "/**" }
    respond:
      status: 404
      body:
        inline:
          error:
            code: "NOT_FOUND"
            message: "Endpoint not found"
