# stunt adapter manifest — PayPal Orders v2-style API simulator (unofficial)
# Docs: https://stuntapi.com/stunt
#
# This adapter mimics the *structure* of the PayPal Orders v2 API for LOCAL
# TESTING ONLY. It does not call the real PayPal API. All data is synthetic.
# See DISCLAIMER.
id: paypal-style
name: "PayPal Orders v2-style API simulator (unofficial)"
version: "0.2.0"

api:
  name: "PayPal Orders API"
  version: "v2"

# Endpoints — each maps a route + method to a Starlark handler.
endpoints:
  # --- OAuth2 token ---
  - route: /v1/oauth2/token
    method: POST
    handler: scripts/oauth.star#on_token

  # --- Orders ---
  - route: /v2/checkout/orders
    method: POST
    handler: scripts/orders.star#on_create_order
  - route: /v2/checkout/orders/{id}
    method: GET
    handler: scripts/orders.star#on_get_order
  - route: /v2/checkout/orders/{id}/approve
    method: POST
    handler: scripts/orders.star#on_approve_order
    concurrency_key: id # read-modify-write of the order status
  - route: /v2/checkout/orders/{id}/capture
    method: POST
    handler: scripts/orders.star#on_capture_order
    concurrency_key: id # read-modify-write of the order + capture creation
  - route: /v2/checkout/orders/{id}/authorize
    method: POST
    handler: scripts/orders.star#on_authorize_order
    concurrency_key: id # read-modify-write of the order + authorization creation

  # --- Payments / Authorizations ---
  - route: /v2/payments/authorizations/{id}
    method: GET
    handler: scripts/authorizations.star#on_get_authorization
  - route: /v2/payments/authorizations/{id}/reauthorize
    method: POST
    handler: scripts/authorizations.star#on_reauthorize_authorization
    concurrency_key: id # read-modify-write of the authorization status
  - route: /v2/payments/authorizations/{id}/void
    method: POST
    handler: scripts/authorizations.star#on_void_authorization
    concurrency_key: id # read-modify-write of the authorization status
  - route: /v2/payments/authorizations/{id}/capture
    method: POST
    handler: scripts/authorizations.star#on_capture_authorization
    concurrency_key: id # read-modify-write of the authorization + capture creation

  # --- Payments / Captures / Refunds ---
  - route: /v2/payments/captures/{id}
    method: GET
    handler: scripts/payments.star#on_get_capture
  - route: /v2/payments/captures/{capture_id}/refund
    method: POST
    handler: scripts/payments.star#on_refund
    concurrency_key: capture_id # over-refund guard reads then writes refund state
  - route: /v2/payments/refunds/{id}
    method: GET
    handler: scripts/payments.star#on_get_refund

  # --- Webhooks ---
  - route: /v1/notifications/webhooks
    method: POST
    handler: scripts/webhooks.star#on_create_webhook
  - route: /v1/notifications/webhooks
    method: GET
    handler: scripts/webhooks.star#on_list_webhooks
  - route: /v1/notifications/webhooks/{id}
    method: DELETE
    handler: scripts/webhooks.star#on_delete_webhook
  - route: /v1/notifications/verify-webhook-signature
    method: POST
    handler: scripts/webhooks.star#on_verify_webhook_signature

# Backing stores — collections for stateful data.
resources:
  - name: orders
    kind: collection
  - name: captures
    kind: collection
  - name: refunds
    kind: collection
  - name: authorizations
    kind: collection
  - name: access_tokens
    kind: collection
  - name: webhooks
    kind: collection

# Auth scheme: OAuth2 bearer tokens.
identity:
  token_scheme: bearer

# Catch-all: any unmatched route returns a 404.
rules:
  - name: catchall-404
    match: { path: "/**" }
    respond:
      status: 404
      body:
        inline:
          name: "RESOURCE_NOT_FOUND"
          message: "not found"
          debug_id: "synthetic-debug"
