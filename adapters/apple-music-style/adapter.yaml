# stunt adapter manifest — Apple Music API simulator (unofficial)
# Docs: https://stuntapi.com/stunt
#
# This adapter mimics the *structure* of the Apple Music API (1.0) for
# LOCAL TESTING ONLY. It does not call the real Apple API. All data is
# synthetic. See DISCLAIMER.
id: apple-music-style
name: "Apple Music API simulator (unofficial)"
version: "0.2.0"

api:
  name: "Apple Music API"
  version: "1.0"

# Endpoints — each maps a route + method to a Starlark handler.
# NOTE: literal routes must come BEFORE parameterized routes so they are
# matched first (the dispatch engine checks in declaration order).
endpoints:
  # --- Catalog (developer JWT): literal 4th segments first ---
  - route: /v1/catalog/{storefront}/search
    method: GET
    handler: scripts/catalog.star#on_search

  - route: /v1/catalog/{storefront}/charts
    method: GET
    handler: scripts/catalog.star#on_charts

  - route: /v1/catalog/{storefront}/songs
    method: GET
    handler: scripts/catalog.star#on_list_songs

  - route: /v1/catalog/{storefront}/albums
    method: GET
    handler: scripts/catalog.star#on_list_albums

  - route: /v1/catalog/{storefront}/artists
    method: GET
    handler: scripts/catalog.star#on_list_artists

  - route: /v1/catalog/{storefront}/playlists
    method: GET
    handler: scripts/catalog.star#on_list_playlists

  # --- Catalog (developer JWT): parameterized 5th segments ---
  - route: /v1/catalog/{storefront}/songs/{id}
    method: GET
    handler: scripts/catalog.star#on_get_song

  - route: /v1/catalog/{storefront}/albums/{id}
    method: GET
    handler: scripts/catalog.star#on_get_album

  - route: /v1/catalog/{storefront}/artists/{id}
    method: GET
    handler: scripts/catalog.star#on_get_artist

  # --- User library (JWT + Music-User-Token): literal paths first ---
  - route: /v1/me/library/songs
    method: GET
    handler: scripts/library.star#on_library_songs

  - route: /v1/me/library/albums
    method: GET
    handler: scripts/library.star#on_library_albums

  - route: /v1/me/library/playlists
    method: GET
    handler: scripts/library.star#on_library_playlists

  - route: /v1/me/library/recently-added
    method: GET
    handler: scripts/library.star#on_recently_added

  # Add catalog resources to the library (ids[songs]=… query params or body).
  - route: /v1/me/library
    method: POST
    handler: scripts/library.star#on_add_library

  # Remove a library resource (songs | albums | playlists).
  - route: /v1/me/library/{type}/{id}
    method: DELETE
    handler: scripts/library.star#on_delete_library

  # Mark a song played ({"id": ..., "type": "songs"}) → 204.
  - route: /v1/me/played
    method: POST
    handler: scripts/library.star#on_played

  # Personal ratings (love/dislike): value -1 | 0 | 1.
  - route: /v1/me/ratings/{type}/{id}
    method: GET
    handler: scripts/library.star#on_get_rating

  - route: /v1/me/ratings/{type}/{id}
    method: PUT
    handler: scripts/library.star#on_put_rating

# Backing stores — collections for stateful data.
resources:
  - name: songs
    kind: collection
  - name: albums
    kind: collection
  - name: artists
    kind: collection
  - name: catalog_playlists
    kind: collection
  - name: library_songs
    kind: collection
  - name: library_albums
    kind: collection
  - name: library_playlists
    kind: collection
  - name: ratings
    kind: collection

# Auth scheme metadata.
identity:
  token_scheme: bearer_jwt

# Catch-all: any unmatched route returns a 404.
rules:
  - name: catchall-404
    match: { path: "/**" }
    respond:
      status: 404
      body:
        inline:
          errors:
            - status: "404"
              code: "not-found"
              title: "The specified resource was not found."
