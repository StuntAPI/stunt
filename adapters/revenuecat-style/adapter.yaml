# stunt adapter manifest — RevenueCat-style API simulator (unofficial)
# Docs: https://stuntapi.com/stunt
#
# This adapter mimics the *structure* of a RevenueCat-style REST API for
# LOCAL TESTING ONLY. It does not call the real RevenueCat API. All data is
# synthetic. See DISCLAIMER.
id: revenuecat-style
name: "RevenueCat-style API simulator (unofficial)"
version: "0.2.0"

api:
  name: "RevenueCat API"
  version: "v1"

# Endpoints — each maps a route + method to a Starlark handler.
# NOTE: literal routes must come BEFORE parameterized routes so they are
# matched first (the dispatch engine checks in declaration order).
# concurrency_key serialises read-modify-write handlers against the same
# subscriber (derive-on-read expiry + revoke transitions).
endpoints:
  # --- Receipts (literal route; reads/writes the subscriber named in the
  # body — no path param to key concurrency on, so it runs unserialised). ---
  - route: /v1/receipts
    method: POST
    handler: scripts/receipts.star#on_post_receipt

  # --- Webhooks ---
  - route: /v1/webhooks
    method: POST
    handler: scripts/webhooks.star#on_create_webhook
  - route: /v1/webhooks
    method: GET
    handler: scripts/webhooks.star#on_list_webhooks

  # --- Subscribers (param routes; specific multi-segment routes first). ---
  - route: /v1/subscribers/{app_user_id}/subscriptions/{product_id}/revoke
    method: POST
    handler: scripts/subscribers.star#on_revoke_subscription
    concurrency_key: app_user_id
  - route: /v1/subscribers/{app_user_id}
    method: GET
    handler: scripts/subscribers.star#on_get_subscriber
    concurrency_key: app_user_id
  - route: /v1/subscribers/{app_user_id}
    method: POST
    handler: scripts/subscribers.star#on_post_subscriber
    concurrency_key: app_user_id
  - route: /v1/subscribers/{app_user_id}
    method: DELETE
    handler: scripts/subscribers.star#on_delete_subscriber
    concurrency_key: app_user_id

# Backing stores — collections for stateful data.
resources:
  - name: subscribers
    kind: collection
  - name: entitlements
    kind: collection
  - name: webhooks
    kind: collection

# Auth scheme metadata (mock: Bearer sk_... public SDK key; the well-known
# static test key in scripts/lib.star is seeded into the token store).
identity:
  token_scheme: bearer

# Catch-all: any unmatched route returns a 404.
rules:
  - name: catchall-404
    match: { path: "/**" }
    respond:
      status: 404
      body:
        inline:
          code: 404
          message: resource not found
