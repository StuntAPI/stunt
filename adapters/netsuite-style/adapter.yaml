# stunt adapter manifest — NetSuite SuiteTalk REST API simulator (unofficial)
# Docs: https://stuntapi.com/stunt
#
# This adapter mimics the *structure* of NetSuite's SuiteTalk REST API (v1)
# for LOCAL TESTING ONLY. It does not call the real NetSuite API. All data is
# synthetic. See DISCLAIMER.
id: netsuite-style
name: "NetSuite SuiteTalk REST API simulator (unofficial)"
version: "0.2.0"

api:
  name: "NetSuite SuiteTalk REST API"
  version: "1.0"

# Endpoints — each maps a route + method to a Starlark handler.
# NOTE: literal routes must come BEFORE parameterized routes so they are
# matched first (the dispatch engine checks in declaration order).
endpoints:
  # --- SuiteQL (POST body: {q: "SELECT * FROM customer"}) ---
  - route: /services/rest/query/v1/suiteql
    method: POST
    handler: scripts/query.star#on_suiteql
  - route: /services/rest/v1/suiteql
    method: POST
    handler: scripts/query.star#on_suiteql

  # --- metadata catalog (literal route BEFORE the parameterized record
  #     routes below) ---
  - route: /services/rest/record/v1/metadata-catalog
    method: GET
    handler: scripts/catalog.star#on_catalog

  # --- record CRUD (customer, salesOrder, invoice, item, employee, vendor,
  #     opportunity, customerPayment): the handlers resolve the record type
  #     from the URL path, so one parameterized route per method serves all
  #     types at the provider-real paths. Unknown record types return the
  #     NetSuite 404 RCRD_TYPE_DSNT_EXIST envelope. concurrency_key on the
  #     read-modify-write methods serializes updates per record id. ---
  - route: /services/rest/record/v1/{recordType}
    method: GET
    handler: scripts/record.star#on_list
  - route: /services/rest/record/v1/{recordType}
    method: POST
    handler: scripts/record.star#on_create
  - route: /services/rest/record/v1/{recordType}/{id}
    method: GET
    handler: scripts/record.star#on_get
  - route: /services/rest/record/v1/{recordType}/{id}
    method: PATCH
    handler: scripts/record.star#on_update
    concurrency_key: id
  - route: /services/rest/record/v1/{recordType}/{id}
    method: DELETE
    handler: scripts/record.star#on_delete

  # --- !transform operations (salesOrder->invoice, invoice->customerPayment,
  #     opportunity->salesOrder); concurrency_key serializes read-modify-write
  #     of the source record (e.g. applying the generated payment) ---
  - route: /services/rest/record/v1/{recordType}/{id}/!transform/{target}
    method: POST
    handler: scripts/transform.star#on_transform
    concurrency_key: id

# Backing stores — collections for stateful data.
resources:
  - name: customers
    kind: collection
    seed: fixtures/customers.jsonl
  - name: salesOrders
    kind: collection
    seed: fixtures/salesOrders.jsonl
  - name: invoices
    kind: collection
    seed: fixtures/invoices.jsonl
  - name: items
    kind: collection
    seed: fixtures/items.jsonl
  - name: employees
    kind: collection
    seed: fixtures/employees.jsonl
  - name: vendors
    kind: collection
    seed: fixtures/vendors.jsonl
  - name: opportunities
    kind: collection
    seed: fixtures/opportunities.jsonl
  - name: customerPayments
    kind: collection
    seed: fixtures/customerPayments.jsonl

# Auth scheme metadata: Token-Based Authentication (TBA) or NLAuth.
identity:
  token_scheme: tba

# Catch-all: any unmatched route returns a 404.
rules:
  - name: catchall-404
    match: { path: "/**" }
    respond:
      status: 404
      body:
        inline:
          type: "https://docs.oracle.com/en/cloud/saas/netsuite-online-help/not-found"
          title: "Not Found"
          status: 404
          "o:errorDetails":
            - detail: "That record does not exist."
              "o:errorCode": "RCRD_DSNT_EXIST"
