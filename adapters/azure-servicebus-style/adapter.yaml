# stunt adapter manifest — Azure Service Bus + Storage SAS simulator (unofficial)
# Docs: https://stuntapi.com/stunt
#
# This adapter mimics the *structure* of the Azure Service Bus + Storage
# queue API (2024-01-01) for LOCAL TESTING ONLY. It does not call the real
# Azure API. All data is synthetic. See DISCLAIMER.
id: azure-servicebus-style
name: "Azure Service Bus + Storage simulator (unofficial)"
version: "0.2.0"

api:
  name: "Azure Service Bus + Storage"
  version: "2024-01-01"

# Endpoints — each maps a route + method to a Starlark handler.
# Literal routes (e.g. /topics/...) come BEFORE param-prefixed routes
# (/{account}/...) so they are matched first.
endpoints:
  # --- Service Bus: send / peek-lock receive on a queue ---
  - route: /{queue}/messages
    method: POST
    handler: scripts/servicebus.star#on_queue_messages
    concurrency_key: queue

  # --- Service Bus: destructive receive (peek-lock + complete) ---
  - route: /{queue}/messages/head
    method: DELETE
    handler: scripts/servicebus.star#on_receive_message

  # --- Service Bus: peek-lock settlement by lock token ---
  - route: /{queue}/messages/{lockToken}/{action}
    method: POST
    handler: scripts/servicebus.star#on_lock_settlement
    concurrency_key: lockToken

  # --- Service Bus: management info ---
  - route: /$topicInfo
    method: GET
    handler: scripts/servicebus.star#on_topic_info

  # --- Topics: management CRUD ---
  - route: /topics
    method: GET
    handler: scripts/topics.star#on_list_topics
  - route: /topics/{topic}
    method: PUT
    handler: scripts/topics.star#on_put_topic
    concurrency_key: topic
  - route: /topics/{topic}
    method: GET
    handler: scripts/topics.star#on_get_topic
  - route: /topics/{topic}
    method: DELETE
    handler: scripts/topics.star#on_delete_topic
    concurrency_key: topic

  # --- Topics: send-to-topic (fan-out to subscriptions) ---
  - route: /topics/{topic}/messages
    method: POST
    handler: scripts/topics.star#on_send_to_topic
    concurrency_key: topic

  # --- Subscriptions: management CRUD ---
  - route: /topics/{topic}/subscriptions
    method: GET
    handler: scripts/topics.star#on_list_subscriptions
  - route: /topics/{topic}/subscriptions/{sub}
    method: PUT
    handler: scripts/topics.star#on_put_subscription
    concurrency_key: sub
  - route: /topics/{topic}/subscriptions/{sub}
    method: GET
    handler: scripts/topics.star#on_get_subscription
  - route: /topics/{topic}/subscriptions/{sub}
    method: DELETE
    handler: scripts/topics.star#on_delete_subscription
    concurrency_key: sub

  # --- Subscriptions: peek-lock receive + settlement ---
  - route: /topics/{topic}/subscriptions/{sub}/messages
    method: POST
    handler: scripts/topics.star#on_receive_subscription
    concurrency_key: sub
  - route: /topics/{topic}/subscriptions/{sub}/messages/{lockToken}/{action}
    method: POST
    handler: scripts/servicebus.star#on_lock_settlement
    concurrency_key: lockToken

  # --- Storage queue: send message (XML body) ---
  - route: /{account}/{queue}/messages
    method: POST
    handler: scripts/storage.star#on_send_storage_message

  # --- Storage queue: receive message (visibility timeout) ---
  - route: /{account}/{queue}/messages
    method: GET
    handler: scripts/storage.star#on_receive_storage_message
    concurrency_key: queue

  # --- Storage queue: delete received message by pop receipt ---
  - route: /{account}/{queue}/messages/{messageid}
    method: DELETE
    handler: scripts/storage.star#on_delete_storage_message
    concurrency_key: messageid

# Backing stores — collections for stateful data.
resources:
  - name: sb_messages
    kind: collection
  - name: sb_topics
    kind: collection
  - name: sb_subscriptions
    kind: collection
  - name: storage_messages
    kind: collection

# Auth scheme metadata.
identity:
  token_scheme: sas_bearer

# Catch-all: any unmatched route returns a 404.
rules:
  - name: catchall-404
    match: { path: "/**" }
    respond:
      status: 404
      body:
        inline:
          error:
            code: "NotFound"
            message: "The specified resource was not found."
