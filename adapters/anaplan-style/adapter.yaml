# stunt adapter manifest — Anaplan API simulator (unofficial)
# Docs: https://stuntapi.com/stunt
#
# This adapter mimics the *structure* of the Anaplan API (v2.0) for LOCAL
# TESTING ONLY. It does not call the real Anaplan API. All data is synthetic.
# See DISCLAIMER.
id: anaplan-style
name: "Anaplan API simulator (unofficial)"
version: "0.1.0"

api:
  name: "Anaplan API"
  version: "2.0"

# Endpoints — each maps a route + method to a Starlark handler.
# NOTE: literal routes must come BEFORE parameterized routes so they are
# matched first (the dispatch engine checks in declaration order).
endpoints:
  # --- Workspaces ---
  - route: /2/0/workspaces
    method: GET
    handler: scripts/workspaces.star#on_list_workspaces

  # --- Models (4th segment) ---
  - route: /2/0/workspaces/{workspaceId}/models
    method: GET
    handler: scripts/models.star#on_list_models
  - route: /2/0/workspaces/{workspaceId}/models/{modelId}/modules
    method: GET
    handler: scripts/models.star#on_list_modules

  # --- Files: upload (full body or Content-Range chunk), download, chunks ---
  - route: /2/0/workspaces/{workspaceId}/models/{modelId}/files
    method: GET
    handler: scripts/files.star#on_list_files
  - route: /2/0/workspaces/{workspaceId}/models/{modelId}/files/{fileId}
    method: GET
    handler: scripts/files.star#on_download_file
  - route: /2/0/workspaces/{workspaceId}/models/{modelId}/files/{fileId}
    method: POST
    handler: scripts/files.star#on_upload_file
    concurrency_key: fileId # chunk appends read-modify-write the chunk table
  - route: /2/0/workspaces/{workspaceId}/models/{modelId}/files/{fileId}
    method: PUT
    handler: scripts/files.star#on_upload_file
    concurrency_key: fileId
  - route: /2/0/workspaces/{workspaceId}/models/{modelId}/files/{fileId}/chunks
    method: GET
    handler: scripts/files.star#on_list_chunks

  # --- Action catalog lists (imports/exports/actions/processes) ---
  - route: /2/0/workspaces/{workspaceId}/models/{modelId}/imports
    method: GET
    handler: scripts/catalog.star#on_list_imports
  - route: /2/0/workspaces/{workspaceId}/models/{modelId}/exports
    method: GET
    handler: scripts/tasks.star#on_list_exports
  - route: /2/0/workspaces/{workspaceId}/models/{modelId}/actions
    method: GET
    handler: scripts/catalog.star#on_list_actions
  - route: /2/0/workspaces/{workspaceId}/models/{modelId}/processes
    method: GET
    handler: scripts/catalog.star#on_list_processes

  # --- Imports: run (tasks = Anaplan's name; jobs = alias) ---
  - route: /2/0/workspaces/{workspaceId}/models/{modelId}/imports/{importId}/tasks
    method: POST
    handler: scripts/tasks.star#on_run_import
  - route: /2/0/workspaces/{workspaceId}/models/{modelId}/imports/{importId}/jobs
    method: POST
    handler: scripts/tasks.star#on_run_import

  # --- Exports: run (tasks + jobs alias) ---
  - route: /2/0/workspaces/{workspaceId}/models/{modelId}/exports/{exportId}/tasks
    method: POST
    handler: scripts/tasks.star#on_run_export
  - route: /2/0/workspaces/{workspaceId}/models/{modelId}/exports/{exportId}/jobs
    method: POST
    handler: scripts/tasks.star#on_run_export

  # --- Tasks: get status (literal last segment) ---
  - route: /2/0/workspaces/{workspaceId}/models/{modelId}/tasks/{taskId}
    method: GET
    handler: scripts/tasks.star#on_get_task
    concurrency_key: taskId # derive-on-read transition persists a state change

  # --- Get single model ---
  - route: /2/0/workspaces/{workspaceId}/models/{modelId}
    method: GET
    handler: scripts/models.star#on_get_model

# Backing stores — collections for stateful data.
resources:
  - name: workspaces
    kind: collection
  - name: tasks
    kind: collection
  - name: files
    kind: collection
  - name: imports
    kind: collection
  - name: exports
    kind: collection
  - name: actions
    kind: collection
  - name: processes
    kind: collection
  - name: modelData
    kind: collection

# Auth scheme metadata.
identity:
  token_scheme: basic_bearer

# Catch-all: any unmatched route returns a 404.
rules:
  - name: catchall-404
    match: { path: "/**" }
    respond:
      status: 404
      body:
        inline:
          status: "FAILURE"
          statusMessage: "Resource not found"
