# stunt adapter manifest — Amazon DynamoDB-style API simulator (unofficial)
# Docs: https://stuntapi.com/stunt
#
# This adapter mimics the *structure* of the Amazon DynamoDB API for
# LOCAL TESTING ONLY. It does not call the real DynamoDB API. All data is
# synthetic. See DISCLAIMER.
#
# DynamoDB speaks one wire protocol: POST / with the operation in the
# X-Amz-Target header (DynamoDB_<api-date>.<Operation>; the exact prefix is
# assembled in scripts/lib.star) and a DynamoDB-JSON body.
id: dynamodb-style
name: "Amazon DynamoDB-style API simulator (unofficial)"
version: "0.1.0"

api:
  name: "Amazon DynamoDB API"
  version: "2012-08-10"

# Endpoints — the whole API is a single POST / dispatch endpoint.
#
# concurrency_key is NOT used here by design: it can only key on a path
# param, and DynamoDB's single POST / route carries the table name in the
# JSON body, not the path. Mutating item ops therefore rely on the
# SQLite-level atomicity of the collection insert/update (see README,
# "Concurrency").
endpoints:
  - route: /
    method: POST
    handler: scripts/service.star#on_service_api

# Backing stores — collections for stateful data.
resources:
  - name: tables
    kind: collection
    seed: fixtures/tables.jsonl
  - name: items
    kind: collection
    seed: fixtures/items.jsonl

# Auth scheme: SigV4 (AWS4-HMAC-SHA256), verified for real (canonical
# request rebuilt + HMAC chain recomputed with the documented synthetic
# credentials, service "dynamodb"; see README).
identity:
  token_scheme: sigv4

# Catch-all: any unmatched route returns a 404 in the DynamoDB error shape.
rules:
  - name: catchall-404
    match: { path: "/**" }
    respond:
      status: 404
      body:
        inline:
          __type: com.amazonaws.dynamodb#ResourceNotFoundException
          message: "404: Not Found"

# Resources notes:
# - tables collection: {id: TableName, name, hashAttr, hashType (S|N|B),
#    rangeAttr ("" when none), rangeType, createdUnix (string epoch, "" for
#    seeds), status, billingMode, provisioned ({read, write} strings or null)}
# - items collection: {id: "<table>|<hash-enc>[|<range-enc>]", table,
#    k: {keyAttr: typed value, ...} (key fields inline for direct matching),
#    attrs: the full typed DynamoDB item}
