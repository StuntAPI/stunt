# stunt adapter manifest — Microsoft Graph API simulator (unofficial)
# Docs: https://stuntapi.com/stunt
#
# This adapter mimics the *structure* of the Microsoft Graph data-plane API
# (Teams / Outlook / OneDrive / SharePoint / Excel) for LOCAL TESTING ONLY.
# It does not call the real Microsoft Graph API. All data is synthetic.
# See DISCLAIMER.
#
# NOTE: this is the DATA plane of Graph (Teams/Outlook/SharePoint/OneDrive/
# Excel) — distinct from entra-id-style which models the identity /
# app-registration plane.
id: microsoft-graph-style
name: "Microsoft Graph API simulator (unofficial)"
version: "0.1.0"

api:
  name: "Microsoft Graph API"
  version: "v1.0"

# Endpoints — each maps a route + method to a Starlark handler.
# NOTE: literal routes must come BEFORE parameterized routes so they are
# matched first (the dispatch engine checks in declaration order).
endpoints:
  # --- /me profile ---
  - route: /v1.0/me
    method: GET
    handler: scripts/me.star#on_me

  # --- Webhook subscriptions (change notifications) ---
  # Literal routes declared before parameterized ones.
  - route: /v1.0/subscriptions
    method: POST
    handler: scripts/subscriptions.star#on_create_subscription
  - route: /v1.0/subscriptions
    method: GET
    handler: scripts/subscriptions.star#on_list_subscriptions
  - route: /v1.0/subscriptions/{id}
    method: GET
    handler: scripts/subscriptions.star#on_get_subscription
  - route: /v1.0/subscriptions/{id}
    method: DELETE
    handler: scripts/subscriptions.star#on_delete_subscription

  # --- Users ---
  - route: /v1.0/users
    method: GET
    handler: scripts/users.star#on_list_users
  - route: /v1.0/users/{id}
    method: GET
    handler: scripts/users.star#on_get_user

  # --- Outlook mail ---
  - route: /v1.0/me/mailFolders
    method: GET
    handler: scripts/mail.star#on_list_folders
  - route: /v1.0/me/mailFolders/{id}/messages
    method: GET
    handler: scripts/mail.star#on_list_folder_messages
  - route: /v1.0/me/messages
    method: GET
    handler: scripts/mail.star#on_list_messages
  - route: /v1.0/me/messages
    method: POST
    handler: scripts/mail.star#on_create_draft_message
  - route: /v1.0/me/messages/{id}/send
    method: POST
    handler: scripts/mail.star#on_send_draft_message
    concurrency_key: id # read-modify-write on the draft, serialized per message
  - route: /v1.0/me/messages/{id}
    method: GET
    handler: scripts/mail.star#on_get_message
  - route: /v1.0/me/messages/{id}
    method: PATCH
    handler: scripts/mail.star#on_update_message
    concurrency_key: id # read-modify-write on the message, serialized per message
  - route: /v1.0/me/messages/{id}
    method: DELETE
    handler: scripts/mail.star#on_delete_message
  - route: /v1.0/me/sendMail
    method: POST
    handler: scripts/mail.star#on_send_mail

  # --- Calendar ---
  # Literal calendarView route declared before the parameterized event routes.
  - route: /v1.0/me/calendarView
    method: GET
    handler: scripts/calendar.star#on_calendar_view
  - route: /v1.0/me/calendar/calendarView
    method: GET
    handler: scripts/calendar.star#on_calendar_view
  - route: /v1.0/me/events
    method: GET
    handler: scripts/calendar.star#on_list_events
  - route: /v1.0/me/events
    method: POST
    handler: scripts/calendar.star#on_create_event
  # Literal action routes declared before the bare {id} routes.
  - route: /v1.0/me/events/{id}/accept
    method: POST
    handler: scripts/calendar.star#on_accept_event
    concurrency_key: id # read-modify-write on the event, serialized per event
  - route: /v1.0/me/events/{id}/decline
    method: POST
    handler: scripts/calendar.star#on_decline_event
    concurrency_key: id # read-modify-write on the event, serialized per event
  - route: /v1.0/me/events/{id}/tentativelyAccept
    method: POST
    handler: scripts/calendar.star#on_tentatively_accept_event
    concurrency_key: id # read-modify-write on the event, serialized per event
  - route: /v1.0/me/events/{id}
    method: GET
    handler: scripts/calendar.star#on_get_event
  - route: /v1.0/me/events/{id}
    method: DELETE
    handler: scripts/calendar.star#on_delete_event
  - route: /v1.0/me/events/{id}
    method: PATCH
    handler: scripts/calendar.star#on_update_event
    concurrency_key: id # read-modify-write on the event, serialized per event

  # --- OneDrive ---
  # NOTE on colon addressing: the router does not recognize "{param}:" as a
  # parameter, but a literal ':' inside a captured VALUE is fine. Routes below
  # use fixed-depth segments where the colon lands inside the captured
  # segment: /root:/{item}/content matches /root:/photo.jpg:/content with
  # item="photo.jpg:" and the handler strips the trailing colon.
  - route: /v1.0/me/drive
    method: GET
    handler: scripts/drive.star#on_get_drive
  - route: /v1.0/me/drive/root/children
    method: GET
    handler: scripts/drive.star#on_list_children
  - route: /v1.0/me/drive/root/children
    method: POST
    handler: scripts/drive.star#on_create_child_root
  - route: /v1.0/me/drive/items/{id}/children
    method: GET
    handler: scripts/drive.star#on_list_item_children
  - route: /v1.0/me/drive/items/{id}/children
    method: POST
    handler: scripts/drive.star#on_create_child_item
  - route: /v1.0/me/drive/items/{id}/content
    method: GET
    handler: scripts/drive_upload.star#on_get_content
  # Recycle-bin restore (literal segment; declared before the bare {id}
  # routes below so it is matched first).
  - route: /v1.0/me/drive/items/{id}/restore
    method: POST
    handler: scripts/drive.star#on_restore_item
    concurrency_key: id # moves a subtree between collections, serialized per item
  - route: /v1.0/me/drive/items/{id}
    method: GET
    handler: scripts/drive.star#on_get_item
  - route: /v1.0/me/drive/items/{id}
    method: DELETE
    handler: scripts/drive.star#on_delete_item
    concurrency_key: id # cascade read-modify-write, serialized per item
  # Simple upload (< 4 MB path): PUT root:/{name}:/content and the
  # items/{parentId}:/{name}:/content variant.
  - route: /v1.0/me/drive/root:/{item}/content
    method: PUT
    handler: scripts/drive_upload.star#on_simple_upload_root
  - route: /v1.0/me/drive/items/{parent}/{item}/content
    method: PUT
    handler: scripts/drive_upload.star#on_simple_upload_item
  # Resumable upload sessions.
  - route: /v1.0/me/drive/root:/{item}/createUploadSession
    method: POST
    handler: scripts/drive_upload.star#on_create_session_root
  - route: /v1.0/me/drive/items/{parent}/{item}/createUploadSession
    method: POST
    handler: scripts/drive_upload.star#on_create_session_item
  - route: /v1.0/_upload/{session}
    method: PUT
    handler: scripts/drive_upload.star#on_upload_chunk
    concurrency_key: session # serialize concurrent chunks on the same upload session
  # Path resolution (GET root:/{path}:/ with ?select=id) — parameterized,
  # declared after the literal root:/... routes above.
  - route: /v1.0/me/drive/root:/{item}
    method: GET
    handler: scripts/drive_upload.star#on_resolve_path

  # --- SharePoint ---
  - route: /v1.0/groups/{id}/sites
    method: GET
    handler: scripts/sharepoint.star#on_list_sites

  # --- Teams chats ---
  - route: /v1.0/me/chats
    method: GET
    handler: scripts/teams.star#on_list_chats
  - route: /v1.0/me/chats
    method: POST
    handler: scripts/teams.star#on_create_chat
  - route: /v1.0/chats/{id}
    method: DELETE
    handler: scripts/teams.star#on_delete_chat
  - route: /v1.0/chats/{id}/messages
    method: GET
    handler: scripts/teams.star#on_list_chat_messages
  - route: /v1.0/chats/{id}/messages
    method: POST
    handler: scripts/teams.star#on_send_chat_message
  - route: /v1.0/chats/{id}/messages/{messageId}
    method: DELETE
    handler: scripts/teams.star#on_delete_chat_message

  # --- Excel ---
  - route: /v1.0/me/drive/items/{id}/workbook/worksheets
    method: GET
    handler: scripts/excel.star#on_list_worksheets
  # Literal rows/add declared before the parameterized {index} routes.
  - route: /v1.0/me/drive/items/{id}/workbook/tables/{name}/rows/add
    method: POST
    handler: scripts/excel.star#on_add_table_row
    concurrency_key: id # read-modify-write on the table doc, serialized per item
  - route: /v1.0/me/drive/items/{id}/workbook/tables/{name}/rows
    method: GET
    handler: scripts/excel.star#on_list_rows
  - route: /v1.0/me/drive/items/{id}/workbook/tables/{name}/rows
    method: POST
    handler: scripts/excel.star#on_create_rows
    concurrency_key: id # read-modify-write on the table doc, serialized per item
  - route: /v1.0/me/drive/items/{id}/workbook/tables/{name}/rows/{index}
    method: PATCH
    handler: scripts/excel.star#on_update_row
    concurrency_key: id # read-modify-write on the table doc, serialized per item
  - route: /v1.0/me/drive/items/{id}/workbook/tables/{name}/rows/{index}
    method: DELETE
    handler: scripts/excel.star#on_delete_row
    concurrency_key: id # read-modify-write on the table doc, serialized per item
  - route: /v1.0/me/drive/items/{id}/workbook/tables/{name}/range
    method: GET
    handler: scripts/excel.star#on_get_range

# Backing stores — collections for stateful data.
resources:
  - name: messages
    kind: collection
  - name: events
    kind: collection
  - name: chats
    kind: collection
  - name: chat_messages
    kind: collection
  - name: files
    kind: collection
  - name: tables
    kind: collection
  - name: recyclebin
    kind: collection
  - name: sessions
    kind: collection
  - name: subscriptions
    kind: collection

# Auth scheme metadata (mock: any Bearer token accepted; presence checked).
identity:
  token_scheme: bearer

# Catch-all: any unmatched route returns a 404.
rules:
  - name: catchall-404
    match: { path: "/**" }
    respond:
      status: 404
      body:
        inline:
          error:
            code: "NotFound"
            message: "Resource not found."
