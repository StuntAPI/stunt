# stunt adapter manifest — Amazon S3-style API simulator (unofficial)
# Docs: https://stuntapi.com/stunt
#
# This adapter mimics the *structure* of the Amazon S3 API for
# LOCAL TESTING ONLY. It does not call the real Amazon S3 API. All data is
# synthetic. See DISCLAIMER.
id: aws-s3-style
name: "Amazon S3-style API simulator (unofficial)"
version: "0.1.0"

api:
  name: "Amazon S3 API"
  version: "2006-03-01"

# Endpoints — each maps a route + method to a Starlark handler.
# Path-style URLs: /{bucket}/{key}
#
# NOTE: literal routes and query-string-driven routes must come BEFORE
# parameterized routes so they are matched first (the dispatch engine
# checks in declaration order).
endpoints:
  # --- Bucket operations ---
  # ListObjectsV2: GET /{bucket}?list-type=2
  - route: /{bucket}
    method: GET
    handler: scripts/objects.star#on_list_or_location
  # Create bucket: PUT /{bucket}
  - route: /{bucket}
    method: PUT
    handler: scripts/buckets.star#on_create_bucket
    concurrency_key: bucket
  # Delete bucket: DELETE /{bucket} (must be empty, per S3 semantics)
  - route: /{bucket}
    method: DELETE
    handler: scripts/buckets.star#on_delete_bucket
    concurrency_key: bucket

  # --- Object operations ---
  # Upload object: PUT /{bucket}/{key} — or UploadPart when the request
  # carries ?partNumber=N&uploadId=... (multipart upload).
  # concurrency_key serialises the read-modify-write (find existing doc +
  # blob id, then insert/update) against concurrent writers of the same
  # bucket (both simple PUTs and part uploads).
  - route: /{bucket}/{key+}
    method: PUT
    handler: scripts/objects.star#on_put_object
    concurrency_key: bucket
  # Download object: GET /{bucket}/{key} — or ListParts with ?uploadId=...
  - route: /{bucket}/{key+}
    method: GET
    handler: scripts/objects.star#on_get_object
  # Head object: HEAD /{bucket}/{key}
  - route: /{bucket}/{key+}
    method: HEAD
    handler: scripts/objects.star#on_head_object
  # Delete object: DELETE /{bucket}/{key} — or AbortMultipartUpload with
  # ?uploadId=... (both mutate object/part state for the bucket).
  - route: /{bucket}/{key+}
    method: DELETE
    handler: scripts/objects.star#on_delete_object
    concurrency_key: bucket
  # Multipart upload POST verb: ?uploads creates (CreateMultipartUpload),
  # ?uploadId=... completes (assembles the object — read-modify-write).
  - route: /{bucket}/{key+}
    method: POST
    handler: scripts/multipart.star#on_post_multipart
    concurrency_key: bucket

# Backing stores — collections for stateful data.
resources:
  - name: buckets
    kind: collection
  - name: objects
    kind: collection
  - name: mpu_uploads
    kind: collection
  - name: mpu_parts
    kind: collection

# Auth scheme: SigV4 (AWS4-HMAC-SHA256), verified for real (canonical
# request rebuilt + HMAC chain recomputed with the documented synthetic
# credentials; see README).
identity:
  token_scheme: custom

# Catch-all: any unmatched route returns a 404 in S3-shaped XML.
rules:
  - name: catchall-404
    match: { path: "/**" }
    respond:
      status: 404
      body:
        inline:
          error: resource_not_found

# Resources notes:
# - buckets collection: {name, created, region}
# - objects collection: {bucket, key, content, contentType, etag,
#                        lastModified, size}
# - mpu_uploads collection: in-progress multipart uploads
#   {id: uploadId, bucket, key, contentType, initiatedUnix}
# - mpu_parts collection: uploaded parts
#   {id: uploadId-partNumber, uploadId, partNumber, etag, size, bid,
#    lastModifiedUnix}
