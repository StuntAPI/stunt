# stunt — continuous integration
# Runs the canonical `just ci` gate on every push and pull request.
# `just ci` = build + test -race + vet + fmt-check + mod-tidy + lint-adapters.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: just ci (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # stunt is pure-Go (modernc.org/sqlite is CGO-free), so the exact
        # host OS doesn't affect the build. Run on Linux for speed; the
        # race detector covers concurrency correctness.
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for `git describe` (version ldflags)

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.3"
          cache: true

      - name: Set up Just (crates.io — casey/just's GitHub releases
          are currently unresolvable by setup-just; revert to the
          extractions/setup-just action when upstream heals)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Just
        run: cargo install just --version 1.39.0 --locked

      - name: Run the canonical gate
        run: just ci

      - name: SDK conformance (real provider SDKs vs adapters)
        run: just conformance

      - name: Set up bun (Node SDK conformance)
        uses: oven-sh/setup-bun@v2

      - name: Node SDK conformance (stripe-node, octokit, twilio-node)
        run: just conformance-node

      - name: Generated files fresh (CONFORMANCE.md, README counts)
        run: |
          just conformance-matrix
          just readme-counts
          if ! git diff --exit-code CONFORMANCE.md conformance/matrix.json README.md; then
            echo "::error::CONFORMANCE.md, conformance/matrix.json or README.md is stale — run 'just conformance-matrix readme-counts' and commit"
            exit 1
          fi

  # The repo description quotes the adapter count; it went stale silently
  # once (said 91 through 95). GITHUB_TOKEN cannot write repo metadata, so
  # this job only fails loudly on drift after landing on main — the fix is
  # `just repo-description` (needs an admin gh token locally).
  repo-description:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Description count matches adapters/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          want="$(ls adapters | grep -c -- '-style$')"
          desc="$(gh api repos/StuntAPI/stunt --jq .description)"
          have="$(printf '%s' "$desc" | sed -E 's/^[^0-9]*([0-9]+).*/\1/')"
          echo "repo has $want adapters; description says '$have'"
          if [ "$have" != "$want" ]; then
            echo "::error::repo description is stale — run 'just repo-description' (needs an admin token)"
            exit 1
          fi
