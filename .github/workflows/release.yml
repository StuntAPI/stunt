# stunt — release pipeline
# Triggered by a version tag (v*.*.*). Builds all six cross-platform targets
# via GoReleaser, publishes a GitHub Release, and pushes the packaging metadata:
#   • Homebrew Cask → stuntapi/homebrew-tap  (macOS: `brew install --cask stuntapi/tap/stunt`)
#   • winget manifest → stuntapi/winget       (Windows: `winget install --manifest ...`)
#
# Prerequisites (configure in the stuntapi/stunt repo settings → Secrets):
#   TAP_GITHUB_TOKEN  — a fine-grained PAT with `contents:write` on BOTH
#                       stuntapi/homebrew-tap AND stuntapi/winget. GoReleaser
#                       uses it to push the Cask + winget manifest on release.
#
# To cut a release:
#   git tag v0.1.0
#   git push --tags
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # GoReleaser creates the GitHub Release
  packages: write

jobs:
  release:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GoReleaser needs full history + tags for changelog/versioning

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.3"
          cache: true

      # casey/just's GitHub releases are currently unresolvable by
      # setup-just; crates.io install instead. Revert when upstream heals.
      - name: Set up Rust (for just)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Just
        run: cargo install just --version 1.39.0 --locked

      - name: Run the CI gate (never release a broken build)
        run: just ci


      - name: Install syft (SBOM tool — GoReleaser's `sboms` pipe shells out to it)
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

      # Artifact provenance: a v0.51.0 re-tag shipped PRE-hardening binaries
      # while every run log claimed the correct checkout (stunt-bt7). The
      # mechanism is unknown, so trust nothing: build a reference binary
      # from THIS checkout and require the shipped one to behave
      # identically. `stunt llm` embeds the hand-maintained reference text,
      # which changes with docs commits — a source-vs-artifact skew of any
      # kind shows up as a diff.
      - name: Verify shipped binary matches this checkout
        run: |
          set -euo pipefail
          go build -o /tmp/ref-stunt ./cmd/stunt
          BIN="$(find dist -name stunt -path '*darwin_arm64*' | head -1)"
          test -x "$BIN"
          /tmp/ref-stunt llm > /tmp/ref.txt
          "$BIN" llm > /tmp/dist.txt
          if ! diff -u /tmp/ref.txt /tmp/dist.txt; then
            echo "::error::shipped binary does not match this checkout (stunt llm differs) — refusing to trust the release artifacts"
            exit 1
          fi
          echo "provenance check: shipped darwin_arm64 binary matches this checkout"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-artifacts
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/*.sbom.json
